<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axion Defect Monitoring Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations</p>
          <h1>Defect Monitoring Dashboard</h1>
        </div>
        <div class="filters" aria-label="Defect filters">
          <label>
            Status
            <select id="statusFilter">
              <option value="">All</option>
              <option value="open">Open</option>
              <option value="triaged">Triaged</option>
              <option value="in-progress">In progress</option>
              <option value="blocked">Blocked</option>
              <option value="resolved">Resolved</option>
              <option value="verified">Verified</option>
            </select>
          </label>
          <label>
            Severity
            <select id="severityFilter">
              <option value="">All</option>
              <option value="critical">Critical</option>
              <option value="major">Major</option>
              <option value="moderate">Moderate</option>
              <option value="minor">Minor</option>
            </select>
          </label>
          <label class="searchbox">
            Search
            <input id="searchInput" type="search" placeholder="ID, assignee, team" />
          </label>
        </div>
      </header>

      <main>
        <section class="summary-grid" id="summaryGrid" aria-live="polite"></section>

        <section class="panel">
          <div class="panel-header">
            <h2>Open defects</h2>
            <div id="resultCount" class="result-count"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Team</th>
                  <th>Severity</th>
                  <th>Status</th>
                  <th>Owner</th>
                  <th>Updated</th>
                </tr>
              </thead>
              <tbody id="defectTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
