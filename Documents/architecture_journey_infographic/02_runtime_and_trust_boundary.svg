<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>One request. One deterministic trust boundary.</title><desc>The caller selects a presentation. The Domain Runtime supplies the grounded context.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#087F83"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F5F8" stroke="none"/><rect x="0" y="0" width="1600" height="192" rx="0" fill="#102B46" stroke="none"/><rect x="48" y="37" width="7" height="26" rx="2" fill="#38D0BD" stroke="none"/><text x="70" y="58" font-size="19" fill="#80E0D3" font-weight="700">AXION  /  BOARD DEFECT INSPECTION</text><text x="1450" y="57" font-size="19" fill="#BCCDDD" font-weight="700">02 / 04</text><text x="48" y="113" font-size="41" fill="#FFFFFF" font-weight="700">One request. One deterministic trust boundary.</text><text x="48" y="153" font-size="20" fill="#CDDAE5" font-weight="400">The caller selects a presentation. The Domain Runtime supplies the grounded context.</text><text x="48" y="225" font-size="16" fill="#087F83" font-weight="700">02  /  AS-BUILT REQUEST &amp; RESPONSE</text><path d="M48 945 H1552" stroke="#CAD7E0"/><text x="48" y="972" font-size="15" fill="#526B7D" font-weight="400">PHASE 0  •  TASKS 1–6A  |  Educational architecture summary; not a specification or quality outcome.</text><text x="1120" y="972" font-size="15" fill="#526B7D" font-weight="400">Source snapshot: 06 Oct 2026  •  165511d</text><rect x="48" y="250" width="370" height="182" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="48" y="250" width="5" height="182" rx="2" fill="#315DC5" stroke="none"/><text x="70" y="281" font-size="15" fill="#315DC5" font-weight="700">UI RUNTIME  /  :5173</text><text x="70" y="315" font-size="24" fill="#203C53" font-weight="700">React browser</text><text x="70" y="341" font-size="17" fill="#203C53" font-weight="400">Fixed API path and method.</text><text x="70" y="362" font-size="17" fill="#203C53" font-weight="400">Same-origin Vite development proxy</text><text x="70" y="383" font-size="17" fill="#203C53" font-weight="400">for /api and /health.</text><rect x="456" y="250" width="1096" height="447" rx="14" fill="#E4EFEE" stroke="#B4D5D1"/><text x="480" y="281" font-size="19" fill="#087F83" font-weight="700">DOMAIN RUNTIME  /  FastAPI · 127.0.0.1:8000</text><rect x="480" y="306" width="324" height="171" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="480" y="306" width="5" height="171" rx="2" fill="#087F83" stroke="none"/><text x="502" y="337" font-size="15" fill="#087F83" font-weight="700">1  /  TRANSPORT</text><text x="502" y="371" font-size="24" fill="#203C53" font-weight="700">Validate the body</text><text x="502" y="397" font-size="17" fill="#203C53" font-weight="400">LandingPageRequest: all fields</text><text x="502" y="418" font-size="17" fill="#203C53" font-weight="400">required; extra=&quot;forbid&quot;. Bad</text><text x="502" y="439" font-size="17" fill="#203C53" font-weight="400">inputs → HTTP 400.</text><rect x="835" y="306" width="324" height="171" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="835" y="306" width="5" height="171" rx="2" fill="#087F83" stroke="none"/><text x="857" y="337" font-size="15" fill="#087F83" font-weight="700">2  /  DOMAIN VALUE</text><text x="857" y="371" font-size="24" fill="#203C53" font-weight="700">ContextPayload</text><text x="857" y="397" font-size="17" fill="#203C53" font-weight="400">Frozen, slotted enum value.</text><text x="857" y="418" font-size="17" fill="#203C53" font-weight="400">Presentation request only; no</text><text x="857" y="439" font-size="17" fill="#203C53" font-weight="400">metrics or contextId.</text><rect x="1190" y="306" width="338" height="171" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="1190" y="306" width="5" height="171" rx="2" fill="#087F83" stroke="none"/><text x="1212" y="337" font-size="15" fill="#087F83" font-weight="700">3  /  ORCHESTRATION</text><text x="1212" y="371" font-size="24" fill="#203C53" font-weight="700">LandingService</text><text x="1212" y="397" font-size="17" fill="#203C53" font-weight="400">Check page / locale against</text><text x="1212" y="418" font-size="17" fill="#203C53" font-weight="400">server context. Never rewrite a</text><text x="1212" y="439" font-size="17" fill="#203C53" font-weight="400">fixture to fit the caller.</text><path d="M418 347 L476 347" fill="none" stroke="#087F83" stroke-width="3"  marker-end="url(#arrow)"/><path d="M805 389 L831 389" fill="none" stroke="#087F83" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1160 389 L1186 389" fill="none" stroke="#087F83" stroke-width="3"  marker-end="url(#arrow)"/><rect x="480" y="503" width="510" height="162" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="480" y="503" width="5" height="162" rx="2" fill="#087F83" stroke="none"/><text x="502" y="534" font-size="15" fill="#087F83" font-weight="700">4  /  SERVER-OWNED INPUT</text><text x="502" y="568" font-size="24" fill="#203C53" font-weight="700">Fixture + GroundedContext</text><text x="502" y="602" font-size="19" fill="#203C53" font-weight="400">Approved presentation fixture and complete</text><text x="502" y="628" font-size="19" fill="#203C53" font-weight="400">grounded context; supplied by the server.</text><rect x="1020" y="503" width="508" height="162" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="1020" y="503" width="5" height="162" rx="2" fill="#A96B0B" stroke="none"/><text x="1042" y="534" font-size="15" fill="#A96B0B" font-weight="700">5  /  ACCEPTANCE GATE</text><text x="1042" y="568" font-size="24" fill="#203C53" font-weight="700">Deterministic Python validator</text><text x="1042" y="602" font-size="19" fill="#203C53" font-weight="400">Structure → vocabulary → grounding → text</text><text x="1042" y="628" font-size="19" fill="#203C53" font-weight="400">policy. The same input yields the same result.</text><path d="M1360 477 V491 H735 V499" fill="none" stroke="#087F83" stroke-width="3" marker-end="url(#arrow)"/><path d="M994 586 L1016 586" fill="none" stroke="#087F83" stroke-width="3"  marker-end="url(#arrow)"/><rect x="48" y="456" width="370" height="241" rx="14" fill="#102B46" stroke="none"/><text x="68" y="488" font-size="19" fill="#80E0D3" font-weight="700">POST /api/v1/ui/landing-page</text><text x="68" y="525" font-size="21" fill="#FFFFFF" font-weight="400">{</text><text x="68" y="554" font-size="21" fill="#FFFFFF" font-weight="400">  &quot;page&quot;: &quot;landing&quot;,</text><text x="68" y="583" font-size="21" fill="#FFFFFF" font-weight="400">  &quot;view&quot;: &quot;overview&quot;,</text><text x="68" y="612" font-size="21" fill="#FFFFFF" font-weight="400">  &quot;locale&quot;: &quot;en-US&quot;</text><text x="68" y="641" font-size="21" fill="#FFFFFF" font-weight="400">}</text><rect x="48" y="731" width="460" height="164" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="48" y="731" width="5" height="164" rx="2" fill="#087F83" stroke="none"/><text x="70" y="762" font-size="15" fill="#087F83" font-weight="700">6  /  HTTP 200</text><text x="70" y="796" font-size="24" fill="#203C53" font-weight="700">Accepted response</text><text x="70" y="830" font-size="19" fill="#203C53" font-weight="400">{spec, bindings, meta}; meta carries</text><text x="70" y="856" font-size="19" fill="#203C53" font-weight="400">contextId, source: &quot;fixture&quot;, validation:</text><text x="70" y="882" font-size="19" fill="#203C53" font-weight="400">&quot;VALID&quot;.</text><rect x="545" y="731" width="460" height="164" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="545" y="731" width="5" height="164" rx="2" fill="#315DC5" stroke="none"/><text x="567" y="762" font-size="15" fill="#315DC5" font-weight="700">7  /  CLIENT ACCEPTANCE</text><text x="567" y="796" font-size="24" fill="#203C53" font-weight="700">unknown → checked envelope</text><text x="567" y="830" font-size="19" fill="#203C53" font-weight="400">acceptLandingResponse() narrows the</text><text x="567" y="856" font-size="19" fill="#203C53" font-weight="400">response before registry-only rendering.</text><rect x="1042" y="731" width="510" height="164" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="1042" y="731" width="5" height="164" rx="2" fill="#A96B0B" stroke="none"/><text x="1064" y="762" font-size="15" fill="#A96B0B" font-weight="700">REJECTION  /  FAIL CLOSED</text><text x="1064" y="796" font-size="24" fill="#203C53" font-weight="700">Sanitized error state</text><text x="1064" y="830" font-size="19" fill="#203C53" font-weight="400">Invalid fixture → 500 VALIDATION_FAILED. Codes</text><text x="1064" y="856" font-size="19" fill="#203C53" font-weight="400">stay in logs; the invalid spec is never</text><text x="1064" y="882" font-size="19" fill="#203C53" font-weight="400">returned.</text><path d="M509 812 L541 812" fill="none" stroke="#087F83" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1270 668 L1270 727" fill="none" stroke="#087F83" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1100 668 V710 H275 V727" fill="none" stroke="#087F83" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="927" font-size="19" fill="#526B7D" font-weight="400">GET /health → {&quot;status&quot;:&quot;ok&quot;} indicates process liveness only. It does not establish inspection readiness.</text></g></svg>