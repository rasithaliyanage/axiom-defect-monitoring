<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>Keep the implemented contract explicit</title><desc>Future extension belongs behind the service and ahead of the validator.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#087F83"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F5F8" stroke="none"/><rect x="0" y="0" width="1600" height="192" rx="0" fill="#102B46" stroke="none"/><rect x="48" y="37" width="7" height="26" rx="2" fill="#38D0BD" stroke="none"/><text x="70" y="58" font-size="19" fill="#80E0D3" font-weight="700">AXION  /  BOARD DEFECT INSPECTION</text><text x="1450" y="57" font-size="19" fill="#BCCDDD" font-weight="700">04 / 04</text><text x="48" y="113" font-size="41" fill="#FFFFFF" font-weight="700">Keep the implemented contract explicit</text><text x="48" y="153" font-size="20" fill="#CDDAE5" font-weight="400">Future extension belongs behind the service and ahead of the validator.</text><text x="48" y="225" font-size="16" fill="#087F83" font-weight="700">04  /  CONTRACT, GOVERNANCE &amp; NEXT SEAM</text><path d="M48 945 H1552" stroke="#CAD7E0"/><text x="48" y="972" font-size="15" fill="#526B7D" font-weight="400">PHASE 0  •  TASKS 1–6A  |  Educational architecture summary; not a specification or quality outcome.</text><text x="1120" y="972" font-size="15" fill="#526B7D" font-weight="400">Source snapshot: 06 Oct 2026  •  165511d</text><rect x="48" y="250" width="720" height="268" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><text x="70" y="283" font-size="17" fill="#087F83" font-weight="700">AS BUILT  /  REQUIRED REQUEST FIELDS</text><rect x="70" y="305" width="676" height="38" rx="5" fill="#EDF3F7" stroke="none"/><text x="86" y="331" font-size="21" fill="#203C53" font-weight="700">page</text><text x="266" y="331" font-size="21" fill="#203C53" font-weight="400">landing</text><rect x="70" y="351" width="676" height="38" rx="5" fill="#EDF3F7" stroke="none"/><text x="86" y="377" font-size="21" fill="#203C53" font-weight="700">view</text><text x="266" y="377" font-size="21" fill="#203C53" font-weight="400">overview | minimal</text><rect x="70" y="397" width="676" height="38" rx="5" fill="#EDF3F7" stroke="none"/><text x="86" y="423" font-size="21" fill="#203C53" font-weight="700">locale</text><text x="266" y="423" font-size="21" fill="#203C53" font-weight="400">en-US</text><text x="70" y="465.0" font-size="19" fill="#203C53" font-weight="400">No defaults. Additional fields → HTTP 400. Query parameters</text><text x="70" y="491.98" font-size="19" fill="#203C53" font-weight="400">do not select the presentation.</text><rect x="792" y="250" width="760" height="268" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="792" y="250" width="5" height="268" rx="2" fill="#A96B0B" stroke="none"/><text x="814" y="281" font-size="15" fill="#A96B0B" font-weight="700">FUTURE  /  NOT IMPLEMENTED IN TASKS 1–6A</text><text x="814" y="315" font-size="24" fill="#203C53" font-weight="700">A model gateway plugs into the seam</text><text x="814" y="349" font-size="19" fill="#203C53" font-weight="400">Service → future model-generated UISpec → unchanged validator →</text><text x="814" y="375" font-size="19" fill="#203C53" font-weight="400">controlled renderer. One bounded repair and deterministic fallback are</text><text x="814" y="401" font-size="19" fill="#203C53" font-weight="400">specified, but not wired. No model calls, database, authentication</text><text x="814" y="427" font-size="19" fill="#203C53" font-weight="400">subsystem, camera / PLC / MES integrations or production deployment.</text><rect x="48" y="542" width="720" height="244" rx="14" fill="#102B46" stroke="none"/><text x="70" y="578" font-size="17" fill="#80E0D3" font-weight="700">SEVEN ARCHITECTURAL RULES</text><text x="70" y="611" font-size="18" fill="#FFFFFF" font-weight="400">01  UI specification only; never executable content.</text><text x="70" y="635" font-size="18" fill="#FFFFFF" font-weight="400">02  Registry is the only render path.</text><text x="70" y="659" font-size="18" fill="#FFFFFF" font-weight="400">03  Validate; bounded repair / fallback are future wiring.</text><text x="70" y="683" font-size="18" fill="#FFFFFF" font-weight="400">04  Model reads no data directly.</text><text x="70" y="707" font-size="18" fill="#FFFFFF" font-weight="400">05  Model makes no quality decisions.</text><text x="70" y="731" font-size="18" fill="#FFFFFF" font-weight="400">06  Model invents nothing; claims must be grounded.</text><text x="70" y="755" font-size="18" fill="#FFFFFF" font-weight="400">07  No authentication subsystem in this phase.</text><rect x="792" y="542" width="760" height="144" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="792" y="542" width="5" height="144" rx="2" fill="#A96B0B" stroke="none"/><text x="814" y="573" font-size="15" fill="#A96B0B" font-weight="700">BUSINESS DECISIONS  /  CANDIDATES ONLY</text><text x="814" y="607" font-size="24" fill="#203C53" font-weight="700">Line, board type and inspection mode</text><text x="814" y="633" font-size="17" fill="#203C53" font-weight="400">Value sets remain undecided. Manufacturing owns line IDs; Manufacturing / Quality</text><text x="814" y="654" font-size="17" fill="#203C53" font-weight="400">own board taxonomy; Quality owns modes.</text><rect x="792" y="701" width="760" height="145" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="792" y="701" width="5" height="145" rx="2" fill="#315DC5" stroke="none"/><text x="814" y="732" font-size="15" fill="#315DC5" font-weight="700">CONTRACT CHANGE  /  GOVERNED TOGETHER</text><text x="814" y="766" font-size="24" fill="#203C53" font-weight="700">No generated_for response field</text><text x="814" y="792" font-size="17" fill="#203C53" font-weight="400">Request echoing is not adopted. New dimensions require coordinated contract,</text><text x="814" y="813" font-size="17" fill="#203C53" font-weight="400">schema, deterministic test and eval changes.</text><rect x="48" y="807" width="720" height="117" rx="14" fill="#DDEDE8" stroke="none"/><text x="70" y="840" font-size="16" fill="#087F83" font-weight="700">REPORTED VERIFICATION  /  06 OCT 2026</text><text x="70" y="875" font-size="27" fill="#203C53" font-weight="700">217 pytest passed  ·  88 UI tests passed</text><text x="70" y="906" font-size="17" fill="#526B7D" font-weight="400">Typecheck, safety lint and build clean; source report, not a fresh run.</text><text x="792" y="878" font-size="15" fill="#087F83" font-weight="700">SOURCE AUTHORITY</text><text x="792" y="904" font-size="16" fill="#203C53" font-weight="400">CLAUDE.md → specs/spec.md → model-contracts.md → ui-spec.schema.json.</text><text x="792" y="925" font-size="16" fill="#203C53" font-weight="400">Repository wins if this summary differs.</text></g></svg>