<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>Schema-valid is only the first gate</title><desc>Four ordered validator gates • 13 stable rejection codes • all rejections reported.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#087F83"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F5F8" stroke="none"/><rect x="0" y="0" width="1600" height="192" rx="0" fill="#102B46" stroke="none"/><rect x="48" y="37" width="7" height="26" rx="2" fill="#38D0BD" stroke="none"/><text x="70" y="58" font-size="19" fill="#80E0D3" font-weight="700">AXION  /  BOARD DEFECT INSPECTION</text><text x="1450" y="57" font-size="19" fill="#BCCDDD" font-weight="700">03 / 04</text><text x="48" y="113" font-size="41" fill="#FFFFFF" font-weight="700">Schema-valid is only the first gate</text><text x="48" y="153" font-size="20" fill="#CDDAE5" font-weight="400">Four ordered validator gates • 13 stable rejection codes • all rejections reported.</text><text x="48" y="225" font-size="16" fill="#087F83" font-weight="700">03  /  DEFENCE IN DEPTH</text><path d="M48 945 H1552" stroke="#CAD7E0"/><text x="48" y="972" font-size="15" fill="#526B7D" font-weight="400">PHASE 0  •  TASKS 1–6A  |  Educational architecture summary; not a specification or quality outcome.</text><text x="1120" y="972" font-size="15" fill="#526B7D" font-weight="400">Source snapshot: 06 Oct 2026  •  165511d</text><rect x="48" y="250" width="958" height="151" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="65" y="268" width="61" height="51" rx="14" fill="#FFF0CF" stroke="none"/><text x="77" y="303" font-size="28" fill="#A96B0B" font-weight="700">01</text><text x="146" y="282" font-size="15" fill="#A96B0B" font-weight="700">STRUCTURE</text><text x="146" y="312" font-size="24" fill="#203C53" font-weight="700">Well formed and bounded</text><text x="146" y="340" font-size="18" fill="#526B7D" font-weight="400">Reject malformed structure and size / depth abuse.</text><text x="146" y="369" font-size="17" fill="#203C53" font-weight="700">E_SCHEMA  ·  E_SIZE_LIMIT  ·  E_DEPTH_LIMIT</text><rect x="48" y="415" width="958" height="151" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="65" y="433" width="61" height="51" rx="14" fill="#FFF0CF" stroke="none"/><text x="77" y="468" font-size="28" fill="#A96B0B" font-weight="700">02</text><text x="146" y="447" font-size="15" fill="#A96B0B" font-weight="700">VOCABULARY</text><text x="146" y="477" font-size="24" fill="#203C53" font-weight="700">Only approved building blocks</text><text x="146" y="505" font-size="18" fill="#526B7D" font-weight="400">Reject unknown components and invalid component props.</text><text x="146" y="534" font-size="17" fill="#203C53" font-weight="700">E_UNKNOWN_COMPONENT  ·  E_PROP_INVALID</text><rect x="48" y="580" width="958" height="177" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="65" y="598" width="61" height="51" rx="14" fill="#FFF0CF" stroke="none"/><text x="77" y="633" font-size="28" fill="#A96B0B" font-weight="700">03</text><text x="146" y="612" font-size="15" fill="#A96B0B" font-weight="700">GROUNDING</text><text x="146" y="642" font-size="24" fill="#203C53" font-weight="700">Every claim traces to context</text><text x="146" y="670" font-size="18" fill="#526B7D" font-weight="400">Reject invented metrics, categories, actions or capabilities.</text><text x="146" y="699" font-size="17" fill="#203C53" font-weight="700">E_UNGROUNDED_METRIC  ·  E_UNKNOWN_DEFECT_CATEGORY</text><text x="146" y="722" font-size="17" fill="#203C53" font-weight="700">E_UNKNOWN_ACTION  ·  E_UNGROUNDED_CAPABILITY</text><text x="146" y="745" font-size="17" fill="#203C53" font-weight="700">E_CONTEXT_MISMATCH</text><rect x="48" y="771" width="958" height="151" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="65" y="789" width="61" height="51" rx="14" fill="#FFF0CF" stroke="none"/><text x="77" y="824" font-size="28" fill="#A96B0B" font-weight="700">04</text><text x="146" y="803" font-size="15" fill="#A96B0B" font-weight="700">TEXT POLICY</text><text x="146" y="833" font-size="24" fill="#203C53" font-weight="700">Presentation never becomes code or verdict</text><text x="146" y="861" font-size="18" fill="#526B7D" font-weight="400">Reject disallowed markup, URLs, code-like text and decision language.</text><text x="146" y="890" font-size="17" fill="#203C53" font-weight="700">E_TEXT_POLICY  ·  E_CODE_LIKE_CONTENT</text><text x="146" y="913" font-size="17" fill="#203C53" font-weight="700">E_DECISION_LANGUAGE</text><rect x="1032" y="250" width="520" height="353" rx="14" fill="#102B46" stroke="none"/><text x="1056" y="284" font-size="16" fill="#80E0D3" font-weight="700">THE ONLY RENDER PATH</text><text x="1056" y="323" font-size="27" fill="#FFFFFF" font-weight="700">Closed registry · 9 components</text><text x="1056" y="366" font-size="22" fill="#FFFFFF" font-weight="400">Hero</text><text x="1310" y="366" font-size="22" fill="#FFFFFF" font-weight="400">Heading</text><text x="1056" y="405" font-size="22" fill="#FFFFFF" font-weight="400">Text</text><text x="1310" y="405" font-size="22" fill="#FFFFFF" font-weight="400">FeatureCard</text><text x="1056" y="444" font-size="22" fill="#FFFFFF" font-weight="400">FeatureGrid</text><text x="1310" y="444" font-size="22" fill="#FFFFFF" font-weight="400">CTA</text><text x="1056" y="483" font-size="22" fill="#FFFFFF" font-weight="400">Alert</text><text x="1310" y="483" font-size="22" fill="#FFFFFF" font-weight="400">InfoPanel</text><text x="1056" y="522" font-size="22" fill="#FFFFFF" font-weight="400">ProgressIndicator</text><text x="1310" y="522" font-size="22" fill="#FFFFFF" font-weight="400"></text><rect x="1032" y="621" width="520" height="155" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="1032" y="621" width="5" height="155" rx="2" fill="#315DC5" stroke="none"/><text x="1054" y="652" font-size="15" fill="#315DC5" font-weight="700">COMPILE + BUILD CONTROLS</text><text x="1054" y="686" font-size="24" fill="#203C53" font-weight="700">Provenance, then enforcement</text><text x="1054" y="720" font-size="19" fill="#203C53" font-weight="400">ApprovedUISpec brand; exhaustive registry map;</text><text x="1054" y="746" font-size="19" fill="#203C53" font-weight="400">own-property lookup; safety lint.</text><rect x="1032" y="794" width="520" height="130" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="1032" y="794" width="5" height="130" rx="2" fill="#A96B0B" stroke="none"/><text x="1054" y="825" font-size="15" fill="#A96B0B" font-weight="700">MEANING OF VALID</text><text x="1054" y="859" font-size="24" fill="#203C53" font-weight="700">Presentation validity only</text><text x="1054" y="885" font-size="17" fill="#203C53" font-weight="400">VALID never means that a board passed inspection.</text></g></svg>