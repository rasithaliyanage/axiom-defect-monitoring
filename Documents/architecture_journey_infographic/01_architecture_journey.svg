<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>Build the safety boundary before the AI</title><desc>From written requirements to a validated, API-backed presentation pipeline.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#087F83"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F5F8" stroke="none"/><rect x="0" y="0" width="1600" height="192" rx="0" fill="#102B46" stroke="none"/><rect x="48" y="37" width="7" height="26" rx="2" fill="#38D0BD" stroke="none"/><text x="70" y="58" font-size="19" fill="#80E0D3" font-weight="700">AXION  /  BOARD DEFECT INSPECTION</text><text x="1450" y="57" font-size="19" fill="#BCCDDD" font-weight="700">01 / 04</text><text x="48" y="113" font-size="41" fill="#FFFFFF" font-weight="700">Build the safety boundary before the AI</text><text x="48" y="153" font-size="20" fill="#CDDAE5" font-weight="400">From written requirements to a validated, API-backed presentation pipeline.</text><text x="48" y="225" font-size="16" fill="#087F83" font-weight="700">01  /  ARCHITECTURE JOURNEY</text><path d="M48 945 H1552" stroke="#CAD7E0"/><text x="48" y="972" font-size="15" fill="#526B7D" font-weight="400">PHASE 0  •  TASKS 1–6A  |  Educational architecture summary; not a specification or quality outcome.</text><text x="1120" y="972" font-size="15" fill="#526B7D" font-weight="400">Source snapshot: 06 Oct 2026  •  165511d</text><rect x="48" y="247" width="358" height="90" rx="14" fill="#E3ECF3" stroke="none"/><text x="68" y="308" font-size="48" fill="#087F83" font-weight="700">7</text><text x="141" y="299" font-size="20" fill="#203C53" font-weight="700">task milestones</text><rect x="430" y="247" width="358" height="90" rx="14" fill="#E3ECF3" stroke="none"/><text x="450" y="308" font-size="48" fill="#087F83" font-weight="700">4</text><text x="523" y="299" font-size="20" fill="#203C53" font-weight="700">validation gates</text><rect x="812" y="247" width="358" height="90" rx="14" fill="#E3ECF3" stroke="none"/><text x="832" y="308" font-size="48" fill="#087F83" font-weight="700">9</text><text x="905" y="299" font-size="20" fill="#203C53" font-weight="700">approved components</text><rect x="1194" y="247" width="358" height="90" rx="14" fill="#E3ECF3" stroke="none"/><text x="1214" y="308" font-size="48" fill="#087F83" font-weight="700">0</text><text x="1287" y="299" font-size="20" fill="#203C53" font-weight="700">model calls in this scope</text><rect x="48" y="361" width="488" height="62" rx="14" fill="#315DC5" stroke="none"/><text x="66" y="388" font-size="19" fill="#FFFFFF" font-weight="700">I  /  FOUNDATION &amp; BOUNDARY</text><text x="66" y="410" font-size="16" fill="#FFFFFF" font-weight="400">Define what is allowed</text><rect x="556" y="361" width="488" height="62" rx="14" fill="#087F83" stroke="none"/><text x="574" y="388" font-size="19" fill="#FFFFFF" font-weight="700">II  /  UI EXECUTION</text><text x="574" y="410" font-size="16" fill="#FFFFFF" font-weight="400">Render only approved input</text><rect x="1064" y="361" width="488" height="62" rx="14" fill="#A96B0B" stroke="none"/><text x="1082" y="388" font-size="19" fill="#FFFFFF" font-weight="700">III  /  RUNTIME &amp; SEAM</text><text x="1082" y="410" font-size="16" fill="#FFFFFF" font-weight="400">Serve only validated output</text><rect x="48" y="442" width="488" height="134" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="48" y="442" width="5" height="134" rx="2" fill="#315DC5" stroke="none"/><text x="70" y="473" font-size="15" fill="#315DC5" font-weight="700">T1  /  REQUIREMENTS</text><text x="70" y="507" font-size="24" fill="#203C53" font-weight="700">Domain &amp; specifications</text><text x="70" y="533" font-size="17" fill="#203C53" font-weight="400">BR / FR / VR traceability; runtime boundaries;</text><text x="70" y="554" font-size="17" fill="#203C53" font-weight="400">seven non-negotiable rules.</text><rect x="48" y="590" width="488" height="134" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="48" y="590" width="5" height="134" rx="2" fill="#315DC5" stroke="none"/><text x="70" y="621" font-size="15" fill="#315DC5" font-weight="700">T2  /  CONTRACT</text><text x="70" y="655" font-size="24" fill="#203C53" font-weight="700">UISpec v1 + JSON Schema</text><text x="70" y="681" font-size="17" fill="#203C53" font-weight="400">specVersion 1.0; closed vocabulary, props, actions</text><text x="70" y="702" font-size="17" fill="#203C53" font-weight="400">and presentation policy.</text><rect x="48" y="738" width="488" height="134" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="48" y="738" width="5" height="134" rx="2" fill="#315DC5" stroke="none"/><text x="70" y="769" font-size="15" fill="#315DC5" font-weight="700">T3  /  VALIDATOR</text><text x="70" y="803" font-size="24" fill="#203C53" font-weight="700">Deterministic acceptance</text><text x="70" y="829" font-size="17" fill="#203C53" font-weight="400">Four ordered gates report all rejections with</text><text x="70" y="850" font-size="17" fill="#203C53" font-weight="400">stable code, field path and gate.</text><rect x="556" y="442" width="488" height="208" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="556" y="442" width="5" height="208" rx="2" fill="#087F83" stroke="none"/><text x="578" y="473" font-size="15" fill="#087F83" font-weight="700">T4  /  CONTROLLED RENDERER</text><text x="578" y="507" font-size="24" fill="#203C53" font-weight="700">A closed component registry</text><text x="578" y="541" font-size="19" fill="#203C53" font-weight="400">Nine components; exhaustive TypeScript map;</text><text x="578" y="567" font-size="19" fill="#203C53" font-weight="400">own-property lookup. ApprovedUISpec records</text><text x="578" y="593" font-size="19" fill="#203C53" font-weight="400">provenance from the offline Python validation</text><text x="578" y="619" font-size="19" fill="#203C53" font-weight="400">gate.</text><rect x="556" y="668" width="488" height="204" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="556" y="668" width="5" height="204" rx="2" fill="#087F83" stroke="none"/><text x="578" y="699" font-size="15" fill="#087F83" font-weight="700">T5  /  RUNNABLE UI</text><text x="578" y="733" font-size="24" fill="#203C53" font-weight="700">Prove the browser path</text><text x="578" y="767" font-size="19" fill="#203C53" font-weight="400">Vite + React + strict TypeScript. Static</text><text x="578" y="793" font-size="19" fill="#203C53" font-weight="400">approved fixtures render through the registry</text><text x="578" y="819" font-size="19" fill="#203C53" font-weight="400">before a network boundary is introduced.</text><rect x="1064" y="442" width="488" height="208" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="1064" y="442" width="5" height="208" rx="2" fill="#A96B0B" stroke="none"/><text x="1086" y="473" font-size="15" fill="#A96B0B" font-weight="700">T6  /  DOMAIN RUNTIME</text><text x="1086" y="507" font-size="24" fill="#203C53" font-weight="700">Move trust to the server</text><text x="1086" y="541" font-size="19" fill="#203C53" font-weight="400">FastAPI validates each fixture against</text><text x="1086" y="567" font-size="19" fill="#203C53" font-weight="400">complete server-owned GroundedContext on</text><text x="1086" y="593" font-size="19" fill="#203C53" font-weight="400">every request. The client accepts a checked</text><text x="1086" y="619" font-size="19" fill="#203C53" font-weight="400">response envelope.</text><rect x="1064" y="668" width="488" height="204" rx="14" fill="#FFFFFF" stroke="#D6E1E8"/><rect x="1064" y="668" width="5" height="204" rx="2" fill="#A96B0B" stroke="none"/><text x="1086" y="699" font-size="15" fill="#A96B0B" font-weight="700">T6A  /  CONTEXT SEAM</text><text x="1086" y="733" font-size="24" fill="#203C53" font-weight="700">Type the presentation request</text><text x="1086" y="767" font-size="19" fill="#203C53" font-weight="400">Required page, view and locale become an</text><text x="1086" y="793" font-size="19" fill="#203C53" font-weight="400">immutable ContextPayload. The service checks</text><text x="1086" y="819" font-size="19" fill="#203C53" font-weight="400">page / locale against its owned context.</text><text x="48" y="916" font-size="16" fill="#087F83" font-weight="700">DESIGN LESSON</text><text x="225" y="916" font-size="23" fill="#203C53" font-weight="700">Contract → validator → renderer → browser → API → typed context seam.</text></g></svg>